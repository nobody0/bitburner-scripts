<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bitburner telemetry</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f2f2ef;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --series-1: #2a78d6;
    --series-2: #7a5bd0;
    --series-3: #1f9e8f;
    --series-4: #c3c2b7;
    --series-5: #d08a3b;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.1);
      --series-1: #3987e5;
      --series-2: #9277e0;
      --series-3: #35b5a4;
      --series-4: #45443f;
      --series-5: #e0a154;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    gap: 10px 12px;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 4px 0 0; font-weight: 600; flex: none; }
  /* The launcher is one unit: it wraps as a block instead of scattering six
     controls across the header and pushing the last one off-screen. */
  .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .group.launch { margin-left: auto; }
  select, input, button {
    background: var(--surface-1);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
  }
  select { max-width: 46ch; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--text-secondary); min-width: 12ch; }
  #status .live { color: var(--good); font-weight: 600; }

  /* --- tab bar: generated from shared/features/registry.ts --- */
  nav#tabs {
    display: flex;
    gap: 2px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    background: var(--surface-2);
  }
  .tab {
    padding: 7px 12px;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.on { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  .tab.locked { opacity: 0.42; }
  .tab.unknown { opacity: 0.66; font-style: italic; }

  #scrubrow {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    color: var(--text-secondary);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  #scrub { flex: 1; }

  main#view {
    display: grid;
    grid-template-columns: minmax(420px, 3fr) minmax(300px, 2fr);
    gap: 12px;
    padding: 12px 16px;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  /* A column of dense tables needs the room; the sidebar keeps its ratio.
     Previously `wide` was written on nine panels and defined nowhere. */
  .col.wide { grid-column: 1; }
  @media (max-width: 1100px) {
    main#view { grid-template-columns: minmax(0, 1fr); }
  }
  section.card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    min-width: 0;
    overflow-x: auto;
  }
  section.card h2 {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  section.card h2 .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; font-weight: 400; }
  .locked-card p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .good { color: var(--good); }
  .bad, .fail { color: var(--critical); }
  .warn { color: var(--series-5); }

  .tiles { display: flex; gap: 18px; margin-bottom: 6px; flex-wrap: wrap; }
  .tile .v { font-size: 19px; font-weight: 600; }
  .tile .l { color: var(--muted); font-size: 12px; }

  #chartwrap { position: relative; }
  canvas { width: 100%; height: 240px; display: block; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    display: none;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 2px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  /* Opt-in wrapping for prose columns (requirement trees, rationales). Without
     it a long string forces the whole card into horizontal scroll, which is
     both ugly and makes the rest of the panel unreadable. */
  th.wrap, td.wrap { white-space: normal; overflow-wrap: anywhere; text-align: left; }
  th.l, td.l { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:hover td { background: var(--surface-2); }

  /* Sortable headers. A button, not a click handler on the th, so keyboard
     users get the same control. */
  th .sortby {
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  th .sortby:hover { color: var(--text-primary); }
  th .sortby.sel { color: var(--text-primary); font-weight: 600; }

  /* --- status dot: one vocabulary across every panel --- */
  .dot { font-size: 10px; line-height: 1; margin-right: 5px; }
  .dot.good { color: var(--good); }
  .dot.ready { color: var(--series-1); }
  .dot.wait { color: var(--series-5); }
  .dot.bad { color: var(--critical); }
  .dot.off { color: var(--baseline); }

  /* --- in-cell meter: a bar behind its own label --- */
  .meter {
    position: relative;
    display: inline-block;
    min-width: 13ch;
    padding: 0 5px;
    border-radius: 3px;
    background: var(--grid);
    overflow: hidden;
    text-align: right;
  }
  .meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--series-1); opacity: 0.35; }
  .meter.done .fill { background: var(--good); opacity: 0.4; }
  .meter .lab { position: relative; }

  /* --- clickable filter chips and search --- */
  .chips.filters { gap: 4px; }
  .chip.pick { cursor: pointer; background: none; color: var(--text-secondary); font: inherit; font-size: 12px; }
  .chip.pick:hover { color: var(--text-primary); }
  .chip.pick.sel { background: var(--series-1); color: #fff; border-color: transparent; }
  .chip .badge { margin-left: 5px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  input.search { padding: 2px 8px; font-size: 12px; min-width: 18ch; }

  /* --- a missing requirement, with the feature that owes it --- */
  .need {
    display: inline-block;
    font-size: 11px;
    padding: 0 4px;
    margin: 1px 2px 1px 0;
    border-radius: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .need.bad { border-color: var(--critical); }
  .need .owner { color: var(--muted); margin-left: 5px; }

  details { margin: 2px 0; }
  details > summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
  details > summary:hover { color: var(--text-primary); }

  dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
  dl.defs dt { color: var(--muted); font-size: 12px; }
  dl.defs dd { margin: 0; font-variant-numeric: tabular-nums; }

  #events { list-style: none; margin: 0; padding: 0; font-size: 12px; max-height: 420px; overflow-y: auto; }
  #events li { padding: 2px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; }
  #events .t { color: var(--muted); flex: none; width: 9ch; }
  #events .data { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- feature status chips (Overview) --- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .chip.on { background: var(--good); color: #fff; border-color: transparent; }
  .chip.idle { color: var(--text-secondary); }
  .chip.off { color: var(--muted); opacity: 0.55; }
  .chip.unknown { color: var(--muted); font-style: italic; }

  /* --- proportional bar --- */
  .bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--grid); }
  .barkey { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
  .barkey .seg { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  .seg { display: block; height: 100%; }
  .seg.s1 { background: var(--series-1); }
  .seg.s2 { background: var(--series-2); }
  .seg.s3 { background: var(--series-3); }
  .seg.s4 { background: var(--series-4); }
  .seg.s5 { background: var(--series-5); }

  /* --- BitNode multipliers: a dense grid, grouped by subsystem --- */
  .multgroup { margin-top: 8px; }
  .multgroup h3 {
    margin: 0 0 3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .mults { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 16px; }
  .mult {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    padding: 1px 0;
    border-bottom: 1px solid var(--grid);
    font-variant-numeric: tabular-nums;
  }
  .mult .nm { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mult .vl { margin-left: auto; }
  .mult .dl { width: 5ch; text-align: right; }

  /* --- BitNode grid --- */
  .nodegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .node { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface-2); }
  .node .n { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .node .lvl { background: var(--good); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; }
  .node .nm { font-size: 12px; color: var(--text-secondary); }
  .node .ft { font-size: 11px; color: var(--muted); }
  .node.current { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
  .node.todo { opacity: 0.5; }

  /* --- Go board and Stanek grid --- */
  .goboard, .gift { display: grid; gap: 2px; margin: 10px 0; max-width: 420px; }
  .goboard .cell, .gift .cell { aspect-ratio: 1; border-radius: 2px; background: var(--grid); }
  .goboard .cell.black { background: #16161a; }
  .goboard .cell.white { background: #f2f2ef; box-shadow: inset 0 0 0 1px var(--baseline); }
  .goboard .cell.dead { background: transparent; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .f0, .gift .cell.f0 { background: var(--series-1); }
  .f1, .gift .cell.f1 { background: var(--series-2); }
  .f2, .gift .cell.f2 { background: var(--series-3); }
  .f3, .gift .cell.f3 { background: var(--series-5); }
  .f4, .gift .cell.f4 { background: var(--good); }
  .f5, .gift .cell.f5 { background: var(--critical); }
</style>
</head>
<body>
<header>
  <h1>bitburner telemetry</h1>
  <div class="group">
    <select id="runpick"></select>
    <span id="status">connecting…</span>
    <button id="simpin" title="Move this stored run into runs/pinned/, where the retention sweep cannot delete it">📌 pin</button>
  </div>
  <div class="group launch">
    <button id="sync" title="Build all configured game entrypoints and push the complete build through the Remote File API">sync to game</button>
    <select id="simprofile" title="A named profile carries its own features, goals, seeds and horizon"></select>
    <select id="simsave" title="Start the run from a registered save snapshot"></select>
    <input id="simgoal" placeholder="earn:1e6" value="earn:1e6" size="14" title="Goal expression, when no profile is selected" />
    <input id="simseeds" placeholder="seeds" value="1" size="8" title="One seed, or a range like 1..5" />
    <input id="simhorizon" placeholder="horizon" value="12h" size="5" title="Simulated time to run for" />
    <button id="simrun">run sim</button>
  </div>
</header>
<nav id="tabs"></nav>
<div id="scrubrow">
  <span>replay</span>
  <input type="range" id="scrub" min="0" max="1000" value="1000" />
  <span id="scrubt"></span>
</div>
<main id="view"></main>
<script type="module" src="/app.js"></script>
</body>
</html>
