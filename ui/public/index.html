<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bitburner telemetry</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f2f2ef;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --series-1: #2a78d6;
    --series-2: #7a5bd0;
    --series-3: #1f9e8f;
    --series-4: #c3c2b7;
    --series-5: #d08a3b;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255, 255, 255, 0.1);
      --series-1: #3987e5;
      --series-2: #9277e0;
      --series-3: #35b5a4;
      --series-4: #45443f;
      --series-5: #e0a154;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, input, button {
    background: var(--surface-1);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
  }
  select { max-width: 46ch; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--text-secondary); }
  #status .live { color: var(--good); font-weight: 600; }

  /* --- tab bar: generated from shared/features/registry.ts --- */
  nav#tabs {
    display: flex;
    gap: 2px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    background: var(--surface-2);
  }
  .tab {
    padding: 7px 12px;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.on { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  .tab.locked { opacity: 0.42; }
  .tab.unknown { opacity: 0.66; font-style: italic; }

  #scrubrow {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    color: var(--text-secondary);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  #scrub { flex: 1; }

  main#view {
    display: grid;
    grid-template-columns: minmax(420px, 3fr) minmax(300px, 2fr);
    gap: 14px;
    padding: 14px 16px;
    align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  section.card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    min-width: 0;
    overflow-x: auto;
  }
  section.card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .locked-card p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .good { color: var(--good); }
  .bad, .fail { color: var(--critical); }

  .tiles { display: flex; gap: 22px; margin-bottom: 8px; flex-wrap: wrap; }
  .tile .v { font-size: 20px; font-weight: 600; }
  .tile .l { color: var(--muted); font-size: 12px; }

  #chartwrap { position: relative; }
  canvas { width: 100%; height: 240px; display: block; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    display: none;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }

  dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
  dl.defs dt { color: var(--muted); font-size: 12px; }
  dl.defs dd { margin: 0; font-variant-numeric: tabular-nums; }

  #events { list-style: none; margin: 0; padding: 0; font-size: 12px; max-height: 420px; overflow-y: auto; }
  #events li { padding: 2px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; }
  #events .t { color: var(--muted); flex: none; width: 9ch; }
  #events .data { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- feature status chips (Overview) --- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .chip.on { background: var(--good); color: #fff; border-color: transparent; }
  .chip.idle { color: var(--text-secondary); }
  .chip.off { color: var(--muted); opacity: 0.55; }
  .chip.unknown { color: var(--muted); font-style: italic; }

  /* --- proportional bar --- */
  .bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--grid); }
  .barkey { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
  .barkey .seg { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  .seg { display: block; height: 100%; }
  .seg.s1 { background: var(--series-1); }
  .seg.s2 { background: var(--series-2); }
  .seg.s3 { background: var(--series-3); }
  .seg.s4 { background: var(--series-4); }
  .seg.s5 { background: var(--series-5); }

  /* --- BitNode grid --- */
  .nodegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
  .node { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface-2); }
  .node .n { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .node .lvl { background: var(--good); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; }
  .node .nm { font-size: 12px; color: var(--text-secondary); }
  .node .ft { font-size: 11px; color: var(--muted); }
  .node.current { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
  .node.todo { opacity: 0.5; }

  /* --- Go board and Stanek grid --- */
  .goboard, .gift { display: grid; gap: 2px; margin: 10px 0; max-width: 420px; }
  .goboard .cell, .gift .cell { aspect-ratio: 1; border-radius: 2px; background: var(--grid); }
  .goboard .cell.black { background: #16161a; }
  .goboard .cell.white { background: #f2f2ef; box-shadow: inset 0 0 0 1px var(--baseline); }
  .goboard .cell.dead { background: transparent; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .f0, .gift .cell.f0 { background: var(--series-1); }
  .f1, .gift .cell.f1 { background: var(--series-2); }
  .f2, .gift .cell.f2 { background: var(--series-3); }
  .f3, .gift .cell.f3 { background: var(--series-5); }
  .f4, .gift .cell.f4 { background: var(--good); }
  .f5, .gift .cell.f5 { background: var(--critical); }
</style>
</head>
<body>
<header>
  <h1>bitburner telemetry</h1>
  <select id="runpick"></select>
  <span id="status">connecting…</span>
  <span style="flex:1"></span>
  <button id="simpin" title="Move this stored run into runs/pinned/, where the retention sweep cannot delete it">📌 pin</button>
  <select id="simprofile" title="A named profile carries its own features, goals, seeds and horizon"></select>
  <select id="simsave" title="Start the run from a registered save snapshot"></select>
  <input id="simgoal" placeholder="earn:1e6" value="earn:1e6" size="18" />
  <input id="simseeds" placeholder="seeds (1 or 1..5)" value="1" size="12" />
  <input id="simhorizon" placeholder="horizon" value="12h" size="6" />
  <button id="simrun">run sim</button>
</header>
<nav id="tabs"></nav>
<div id="scrubrow">
  <span>replay</span>
  <input type="range" id="scrub" min="0" max="1000" value="1000" />
  <span id="scrubt"></span>
</div>
<main id="view"></main>
<script type="module" src="/app.js"></script>
</body>
</html>
