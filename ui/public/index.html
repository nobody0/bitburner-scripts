<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bitburner telemetry</title>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header>
  <h1>bitburner telemetry</h1>
  <div class="group">
    <select id="runpick"></select>
    <span id="status">connecting…</span>
    <button id="simpin" title="Move this stored run into runs/pinned/, where the retention sweep cannot delete it">pin</button>
  </div>
  <div class="group launch">
    <button id="sync" title="Build all configured game entrypoints and push the complete build through the Remote File API">sync</button>
    <select id="simprofile" title="A named profile carries its own features, goals, seeds and horizon"></select>
    <select id="simsave" title="Start the run from a registered save snapshot"></select>
    <input id="simgoal" placeholder="earn:1e6" value="earn:1e6" size="14" title="Goal expression, when no profile is selected" />
    <input id="simseeds" placeholder="seeds" value="1" size="8" title="One seed, or a range like 1..5" />
    <input id="simhorizon" placeholder="horizon" value="12h" size="5" title="Simulated time to run for" />
    <button id="simrun">run sim</button>
  </div>
</header>
<nav id="tabs"></nav>
<aside id="specdrawer" hidden>
  <header class="spec-head">
    <div>
      <div id="spectitle">feature spec</div>
      <div id="specpath"></div>
    </div>
    <button id="specclose" type="button" title="Close feature documentation">close</button>
  </header>
  <article id="specbody"></article>
</aside>
<div id="scrubrow">
  <span>replay</span>
  <input type="range" id="scrub" min="0" max="1000" value="1000" />
  <span id="scrubt"></span>
</div>
<main id="view"></main>
<script type="module" src="/app.js"></script>
</body>
</html>
