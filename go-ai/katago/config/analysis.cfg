# Single-threaded adviser configuration. Per-position visit counts
# are supplied by the arena. The engine is deliberately kept outside the
# learner and never writes training data or modifies promoted checkpoints.
logDir = go-ai/katago/results/logs
logToStderr = false
logAllRequests = false
logAllResponses = false
warnUnusedFields = true

numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14

maxVisits = 32
analysisPVLen = 3
reportAnalysisWinratesAs = BLACK
rootNoiseEnabled = false
rootSymmetryPruning = false
useGraphSearch = true

# IPvGO values winning first and score second. Duration/Power remains an
# external IPvGO concern and is never learned from KataGo's value output.
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.10
dynamicScoreUtilityFactor = 0.10
