[test]
# Simulations declare themselves through tests/support/lanes.ts and skip
# without BB_LANES set, so they need no help here. These three cannot: they
# import ipvgobruteforce/, the certificate tree that lives outside this
# repository (see .gitignore), and so throw at module load before any lane
# gate is reached. Their tags live in tools/test-lanes.ts, which overrides
# this list with --path-ignore-patterns; keep the two in step.
pathIgnorePatterns = [
  "**/ipvgo-bruteforce-arena.test.ts",
  "**/ipvgo-bruteforce-multi-arena.test.ts",
  "**/go-certified-terminal-regret.test.ts",
]
